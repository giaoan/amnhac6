    <meta charset="UTF-8">

    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Tone.js để tạo âm thanh cho trò chơi -->

    <style>
        /* Thiết lập font Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
            transition: background-color 0.2s ease; /* Thêm transition cho background */
        }

        /* Styling cho Vòng Quay - Đã tăng kích thước lên 500px */
        .wheel-container {
            position: relative;
            width: 500px; 
            height: 500px; 
            margin: 0 auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #3b82f6;
            transition: transform 5s cubic-bezier(0.25, 0.1, 0, 1.0); /* Animation mượt mà hơn */
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .segment {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 50%;
            transform-origin: 0% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px; /* Đã tăng cỡ chữ */
            font-weight: bold;
            color: white;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
            border: 1px solid rgba(0, 0, 0, 0.1);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        }

        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #ef4444; /* Màu đỏ nổi bật */
            z-index: 10;
        }

        /* Modal styling */
        .modal {
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        .question-box {
            animation: fadeInScale 0.3s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        /* --- HIỆU ỨNG THỊ GIÁC ĐỘNG (MC Techniques) --- */

        /* 1. Hiệu ứng Flash khi trả lời Đúng/Sai */
        .flash-correct {
            animation: flashGreen 0.2s ease-in-out;
        }
        .flash-incorrect {
            animation: flashRed 0.2s ease-in-out;
        }
        @keyframes flashGreen {
            0% { background-color: #f7f9fb; }
            50% { background-color: #34d399; } /* Màu xanh lá nổi bật */
            100% { background-color: #f7f9fb; }
        }
        @keyframes flashRed {
            0% { background-color: #f7f9fb; }
            50% { background-color: #f87171; } /* Màu đỏ nổi bật */
            100% { background-color: #f7f9fb; }
        }

        /* 2. Hiệu ứng Pulse cho Nút Quay (MC Build-up) */
        .spin-prepare {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1.05); }
            50% { transform: scale(1); }
        }

        /* Loading Spinner */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // --- 1. Dữ liệu Vòng Quay, Điểm, và Câu Hỏi ---
        
        // Mảng các ô (Segments) trên vòng quay

        const PENALTY_QUESTIONS = [
            {

            {

                answer: "3"

        // --- TONE.JS AUDIO CONTROLLER SETUP ---
        const AudioController = {
            isInitialized: false,
            mainSynth: null,
            metalSynth: null,
            noiseSynth: null,
            
            async init() {
                if (this.isInitialized) return;
                try {
                    await Tone.start();
                    this.isInitialized = true;

                    // 1. Synth cho âm thanh tích cực (Correct)
                    this.mainSynth = new Tone.Synth({

                    }).toDestination();
                    
                    // 2. Metal Synth cho âm báo kết quả quay
                    this.metalSynth = new Tone.MetalSynth({
                        frequency: 200, 
                        envelope: { attack: 0.001, decay: 1.0, release: 0.2 },
                        harmonicity: 5.1,
                        modulationIndex: 32,
                        resonance: 4000,
                        octaves: 1.5
                    }).toDestination();

                    // 3. Noise Synth cho âm thanh tiêu cực (Incorrect/Penalty/Miss)
                    this.noiseSynth = new Tone.NoiseSynth({
                        noise: { type: "white" },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.5 }
                    }).toDestination();

                } catch (error) {

                }
            },

            // Âm thanh bắt đầu quay (Tăng dần pitch)
            playSpinStart() {
                if (!this.isInitialized) return;
                const notes = ["C4", "E4", "G4", "C5"];
                notes.forEach((note, index) => {
                    this.mainSynth.triggerAttackRelease(note, "8n", Tone.now() + index * 0.1, 0.5);
                });

            // Âm thanh kết thúc quay / Kết quả chung
            playResultChime() {
                if (!this.isInitialized) return;
                this.metalSynth.triggerAttackRelease("G4", 0.5);
            },

            // Âm thanh trả lời Đúng (Sửa lỗi: dùng Arpeggio)
            playCorrect() {
                if (!this.isInitialized) return;
                const notes = ["E5", "G5", "C6"];
                const now = Tone.now();
                
                notes.forEach((note, index) => {
                    this.mainSynth.triggerAttackRelease(note, "4n", now + index * 0.05);
                });
            },

            // Âm thanh trả lời Sai/Mất Lượt/Phạt
            playIncorrect() {
                if (!this.isInitialized) return;
                this.noiseSynth.triggerAttackRelease(0.5);
                this.mainSynth.triggerAttackRelease("C3", "8n", "+0.1"); // Thêm tiếng bass rớt
            }
        };
        // --- END TONE.JS AUDIO CONTROLLER SETUP ---
        
        // --- 2. Biến Trạng Thái và Quản lý Điểm Số (Leaderboard) ---

        let teams = [
            { id: 1, name: "Đội A", score: 0, color: "#ef4444" },

            { id: 3, name: "Đội C", score: 0, color: "#3b82f6" }
        ];

        let isSpinning = false;
        let currentQuestion = null;
        let currentSpinResult = null;
        let currentPlayerIndex = 0; // Chỉ số đội chơi hiện tại

        // Khai báo biến DOM toàn cục
        let wheel, spinButton, questionModal, questionText, optionsContainer, timerDisplay, feedbackMessage, teamTurnDisplay, leaderboardContainer, currentSegmentDisplay, generateQuestionButton, readQuestionButton;

        // --- 3. LOGIC GEMINI API ---

        const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=";
        const TTS_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=";
        const apiKey = ""; // Canvas sẽ tự động cung cấp API key

        /**
         * Chuyển Base64 data thành ArrayBuffer
         * @param {string} base64 - Dữ liệu audio base64.
         * @returns {ArrayBuffer}
         */
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        /**
         * Chuyển đổi dữ liệu PCM (16-bit, signed) thành Blob file WAV
         * @param {Int16Array} pcm16 - Dữ liệu PCM 16-bit.
         * @param {number} sampleRate - Tốc độ mẫu (ví dụ: 24000).
         * @returns {Blob}
         */
        function pcmToWav(pcm16, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcm16.length * (bitsPerSample / 8);
            const buffer = new ArrayBuffer(44 + dataSize); // 44 bytes cho header WAV
            const view = new DataView(buffer);

            // Ghi header RIFF
            view.setUint32(0, 0x52494646, false); // "RIFF"
            view.setUint32(4, 36 + dataSize, true); // Tổng kích thước file - 8
            view.setUint32(8, 0x57415645, false); // "WAVE"

            // Ghi header FMT
            view.setUint32(12, 0x666d7420, false); // "fmt "
            view.setUint32(16, 16, true); // Kích thước chunk FMT
            view.setUint16(20, 1, true); // Định dạng audio (1 = PCM)
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            // Ghi header DATA
            view.setUint32(36, 0x64617461, false); // "data"
            view.setUint32(40, dataSize, true);

            // Ghi dữ liệu PCM
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += 2;
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }


        /**
         * Gọi API Gemini TTS để đọc câu hỏi
         * @param {string} text - Nội dung câu hỏi cần đọc.
         */
        async function readQuestionAloud(text) {
            if (!text || readQuestionButton.disabled) return;
            
            const originalText = readQuestionButton.innerHTML;
            readQuestionButton.disabled = true;
            readQuestionButton.innerHTML = '<div class="spinner inline-block mr-2"></div> Đang đọc...';
            
            // Xây dựng prompt cho TTS, yêu cầu giọng đọc rõ ràng, mang tính giáo dục
            const ttsPrompt = `Đọc câu hỏi sau đây với giọng giáo viên âm nhạc nhẹ nhàng và rõ ràng: ${text}`;

            const payload = {
                contents: [{ parts: [{ text: ttsPrompt }] }],
                generationConfig: {
                    responseModalities: ["AUDIO"],
                    speechConfig: {
                        voiceConfig: {
                            // Chọn giọng Kore vì nó có độ rõ ràng và mang tính giáo dục cao
                            prebuiltVoiceConfig: { voiceName: "Kore" }
                        }
                    }
                },
                model: "gemini-2.5-flash-preview-tts"
            };

            try {
                const response = await fetch(TTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType; // Nên là audio/L16;rate=24000

                if (audioData && mimeType && mimeType.startsWith("audio/L16")) {
                    // Lấy sample rate từ mimetype (ví dụ: audio/L16;rate=24000)
                    const rateMatch = mimeType.match(/rate=(\d+)/);
                    const sampleRate = rateMatch ? parseInt(rateMatch[1], 10) : 24000;
                    
                    const pcmData = base64ToArrayBuffer(audioData);
                    // API trả về PCM 16-bit signed
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    // Phát audio
                    const audio = new Audio(audioUrl);
                    audio.play();

                    // Khôi phục nút sau khi audio kết thúc
                    audio.onended = () => {
                        readQuestionButton.innerHTML = originalText;
                        readQuestionButton.disabled = false;
                    };
                    
                } else {
                    throw new Error("Dữ liệu audio không hợp lệ hoặc bị thiếu.");
                }

            } catch (error) {
                console.error("Lỗi TTS API:", error);
                showFeedback("Lỗi: Không thể đọc câu hỏi. Vui lòng kiểm tra console.");
            } finally {
                // Đảm bảo nút được khôi phục nếu có lỗi xảy ra trước khi phát
                if (readQuestionButton.innerHTML.includes('Đang đọc')) {
                    readQuestionButton.innerHTML = originalText;
                    readQuestionButton.disabled = false;
                }
            }
        }


        /**
         * Gọi API Gemini để sinh ra một câu hỏi trắc nghiệm mới.
         * Yêu cầu đầu ra là JSON để dễ dàng phân tích.
         */
        async function generateNewQuestion() {
            // Hiển thị trạng thái tải và vô hiệu hóa nút
            const originalText = generateQuestionButton.innerHTML;
            generateQuestionButton.disabled = true;
            generateQuestionButton.innerHTML = '<div class="spinner inline-block mr-2"></div> Đang tạo...';
            
            // Vô hiệu hóa nút TTS trong khi tạo câu hỏi mới
            readQuestionButton.disabled = true;
            
            // Xóa nội dung câu hỏi và tùy chọn cũ
            questionText.textContent = "Đang tải câu hỏi mới từ AI. Vui lòng đợi...";
            optionsContainer.innerHTML = '';
            
            // Các chủ đề: Học hát, Nhạc lí, Tập đọc nhạc, Âm nhạc thường thức, Nghe và Đoán/Nghệ sĩ, giới hạn Sách Cánh Diều.
            const systemPrompt = `Bạn là một giáo viên âm nhạc lớp 6, chuyên về chương trình Sách Cánh Diều. Hãy tạo một câu hỏi trắc nghiệm (4 lựa chọn, 1 đáp án đúng) về Âm nhạc lớp 6, tập trung vào các chủ đề: Học hát, Nhạc lí, Tập đọc nhạc, Âm nhạc thường thức, hoặc Nghe và Đoán/Nghệ sĩ.`;
            const userQuery = `Tạo một câu hỏi trắc nghiệm về Âm nhạc 6 (Sách Cánh Diều). Hãy chọn ngẫu nhiên một trong các chủ đề sau: Học hát, Nhạc lí, Tập đọc nhạc, Âm nhạc thường thức, hoặc Nghe và Đoán/Nghệ sĩ. Đảm bảo chỉ có một đáp án đúng và định dạng kết quả là JSON.`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "q": { "type": "STRING", "description": "Câu hỏi trắc nghiệm." },
                            "options": { 
                                "type": "ARRAY", 
                                "description": "Mảng 4 lựa chọn trả lời.", 
                                "items": { "type": "STRING" } 
                            },
                            "answer": { "type": "STRING", "description": "Đáp án đúng phải nằm trong mảng options." },
                            "topic": { "type": "STRING", "description": "Chủ đề của câu hỏi (ví dụ: Học hát, Lý thuyết, Nhạc cụ)." }
                        },
                        required: ["q", "options", "answer"]
                    }
                }
            };
            
            try {
                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                if (jsonText) {
                    const newQuestion = JSON.parse(jsonText);
                    // Dùng câu hỏi mới này để hiển thị
                    showQuestion([newQuestion], false, true); 
                } else {
                    throw new Error("Không nhận được câu trả lời từ AI.");
                }

            } catch (error) {
                console.error("Lỗi gọi API Gemini:", error);
                showFeedback("Lỗi: Không thể tạo câu hỏi mới từ AI. Dùng câu hỏi cố định.");
                // Quay lại câu hỏi cố định nếu thất bại
                showQuestion(QUESTIONS, false); 
            } finally {
                // Khôi phục nút
                generateQuestionButton.innerHTML = originalText;
                generateQuestionButton.disabled = false;
                readQuestionButton.disabled = false; // Khôi phục nút TTS
            }
        }


        // --- 4. DOM Elements và Khởi tạo ---

        /**
         * Áp dụng hiệu ứng động (flash màn hình hoặc pulse nút)
         * @param {string} type - 'correct', 'incorrect', 'start' (pulse button), 'stop' (stop pulse)
         */
        function applyDynamicEffect(type) {
            const body = document.body;
            body.classList.remove('flash-correct', 'flash-incorrect');
            
            if (type === 'correct') {
                body.classList.add('flash-correct');
            } else if (type === 'incorrect') {
                body.classList.add('flash-incorrect');
            } else if (type === 'start') {
                spinButton.classList.add('spin-prepare');
                spinButton.classList.add('transform', 'scale-105'); 
            } else if (type === 'stop') {
                spinButton.classList.remove('spin-prepare');
                spinButton.classList.remove('transform', 'scale-105'); 
            }

            // Xóa hiệu ứng flash sau 0.5 giây
            if (type === 'correct' || type === 'incorrect') {
                setTimeout(() => {
                    body.classList.remove('flash-correct', 'flash-incorrect');
                }, 500);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            // Gán giá trị cho các biến DOM sau khi DOM đã sẵn sàng
            wheel = document.getElementById('wheel');
            spinButton = document.getElementById('spinButton');
            questionModal = document.getElementById('questionModal');
            questionText = document.getElementById('questionText');
            optionsContainer = document.getElementById('optionsContainer');
            timerDisplay = document.getElementById('timerDisplay');
            feedbackMessage = document.getElementById('feedbackMessage');
            teamTurnDisplay = document.getElementById('teamTurn');
            leaderboardContainer = document.getElementById('leaderboard');
            currentSegmentDisplay = document.getElementById('currentSegment');
            generateQuestionButton = document.getElementById('generateQuestionButton'); // Nút tạo câu hỏi AI
            readQuestionButton = document.getElementById('readQuestionButton'); // Nút TTS mới
            
            drawWheel();
            updateLeaderboard();
            updateTurnDisplay();
            spinButton.addEventListener('click', spinWheel);
            
            // Event listener cho nút tạo câu hỏi AI
            generateQuestionButton.addEventListener('click', () => {
                generateNewQuestion();
                startQuestionTimer(TIME_LIMIT); 
            });

            // Event listener cho nút TTS
            readQuestionButton.addEventListener('click', () => {
                if (currentQuestion && currentQuestion.q) {
                    readQuestionAloud(currentQuestion.q);
                } else {
                    showFeedback("Không có câu hỏi nào để đọc!");
                }
            });
        });

        // --- 5. Chức năng Vẽ Vòng Quay ---
        
        function drawWheel() {
            const numSegments = SEGMENTS.length;
            const anglePerSegment = 360 / numSegments;

            wheel.innerHTML = '';

            SEGMENTS.forEach((segment, index) => {
                const element = document.createElement('div');
                element.classList.add('segment');
                element.style.backgroundColor = segment.color;
                
                const rotation = index * anglePerSegment;
                element.style.transform = `rotate(${rotation}deg) skewY(-${90 - anglePerSegment}deg)`;
                
                const label = document.createElement('span');
                label.textContent = segment.text;
                label.style.transform = `skewY(${90 - anglePerSegment}deg) rotate(${anglePerSegment / 2}deg)`;
                label.style.position = 'absolute';
                label.style.width = '150px'; 
                
                if (numSegments === 8) {
                    label.style.left = '5px'; 
                }
                element.appendChild(label);
                wheel.appendChild(element);
            });
        }

        // --- 6. Chức năng Quay Vòng Quay ---

        function spinWheel() {
            if (isSpinning) return;
            
            // Phase 1: MC Build-up (1 giây)
            applyDynamicEffect('start'); 
            spinButton.textContent = "HÍT THỞ SÂU... SẴN SÀNG!";
            spinButton.disabled = true;

            // Chờ 1 giây để MC/học sinh đếm ngược
            setTimeout(() => {
                // Phase 2: Actual Spin Start
                applyDynamicEffect('stop'); // Ngừng pulse
                spinButton.textContent = "ĐANG QUAY..."; 
                
                isSpinning = true;
                feedbackMessage.textContent = '';
                
                AudioController.init(); 
                AudioController.playSpinStart(); 
                
                const minDegrees = 1800; 
                const maxDegrees = 3600;
                const randomDegrees = Math.floor(Math.random() * (maxDegrees - minDegrees + 1)) + minDegrees;
                
                const numSegments = SEGMENTS.length;
                const anglePerSegment = 360 / numSegments;
                const targetSegmentIndex = Math.floor(Math.random() * numSegments);
                
                const segmentCenter = targetSegmentIndex * anglePerSegment + (anglePerSegment / 2); 
                const stopAngle = randomDegrees - (randomDegrees % 360) + (360 - (segmentCenter + 90) % 360);
                
                wheel.style.transform = `rotate(${stopAngle}deg)`;
                
                // Bắt đầu xử lý sau khi quay xong
                setTimeout(() => {
                    isSpinning = false;
                    spinButton.textContent = "QUAY NGAY";
                    handleSpinResult(targetSegmentIndex);
                    spinButton.disabled = false;
                }, 5500); // 500ms (transition) + 500ms (buffer)

            }, 1000); // 1 second delay for MC build-up
        }

        // --- 7. Xử lý Kết quả Vòng Quay ---

        function handleSpinResult(index) {
            currentSpinResult = SEGMENTS[index];
            currentSegmentDisplay.textContent = `Kết quả: ${currentSpinResult.text}`;
            
            AudioController.playResultChime(); // Phát âm báo kết quả

            if (currentSpinResult.type === "miss") {
                showFeedback(`Ô **${currentSpinResult.text}**! Đội ${teams[currentPlayerIndex].name} mất lượt.`);
                AudioController.playIncorrect(); // Âm thanh mất lượt
                moveToNextPlayer();
            } else if (currentSpinResult.type === "transfer") {
                // Thay thế prompt bằng một modal tùy chỉnh nếu có thể, hiện tại vẫn dùng prompt
                const teamToChallenge = prompt(`Ô ${currentSpinResult.text}! Bạn muốn chuyển câu hỏi này cho Đội A, Đội B hay Đội C? (Gõ A, B, hoặc C)`);
                challengeTeam(teamToChallenge);
            } else {
                const isPenalty = currentSpinResult.type === "penalty";
                showQuestion(isPenalty ? PENALTY_QUESTIONS : QUESTIONS, isPenalty);
            }
        }

        // Chức năng Chuyển/Thách Đấu
        function challengeTeam(teamInput) {
            if (!teamInput) {
                 showFeedback("Bạn đã hủy chuyển câu hỏi. Đội hiện tại tự trả lời.");
                 showQuestion(QUESTIONS, false);
                 return;
            }

            const challengedTeam = teams.find(t => t.name === `Đội ${teamInput.toUpperCase()}`);
            if (challengedTeam) {
                const transferringPlayerIndex = currentPlayerIndex;
                
                currentPlayerIndex = teams.findIndex(t => t.id === challengedTeam.id);
                updateTurnDisplay();
                
                showFeedback(`Đội ${teams[transferringPlayerIndex].name} đã chuyển câu hỏi cho Đội **${challengedTeam.name}**!`);

                showQuestion(QUESTIONS, false); 
            } else {
                showFeedback("Không tìm thấy đội. Đội hiện tại tự trả lời.");
                showQuestion(QUESTIONS, false);
            }
        }

        // --- 8. Hiển thị Câu Hỏi và Timer ---

        /**
         * Bắt đầu hoặc khởi động lại bộ đếm thời gian trả lời câu hỏi.
         * @param {number} duration - Thời gian giới hạn (giây).
         */
        function startQuestionTimer(duration) {
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            let timeLeft = duration;
            timerDisplay.textContent = `Thời gian: ${timeLeft}s`;
            timerDisplay.classList.remove('text-red-500');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `Thời gian: ${timeLeft}s`;

                if (timeLeft <= 10) {
                    timerDisplay.classList.add('text-red-500');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = "HẾT GIỜ!";
                    // Xử lý hết giờ tương đương trả lời sai
                    checkAnswer(null, currentSpinResult.type === "penalty"); 
                }
            }, 1000);
        }

        /**
         * Hiển thị modal câu hỏi.
         * @param {Array} questionPool - Mảng các câu hỏi (có thể chỉ có 1 câu từ AI).
         * @param {boolean} isPenalty - Có phải là câu hỏi Ô PHẠT không.
         * @param {boolean} isAIQuestion - Có phải là câu hỏi do AI tạo không.
         */
        function showQuestion(questionPool, isPenalty, isAIQuestion = false) {
            if (isAIQuestion) {
                 currentQuestion = questionPool[0];
            } else {
                currentQuestion = questionPool[Math.floor(Math.random() * questionPool.length)];
            }
            
            const segmentText = isPenalty ? "Ô PHẠT (Trừ 10 điểm)" : currentSpinResult.text;
            questionModal.classList.remove('hidden');
            
            let title = isPenalty ? "CÂU HỎI PHỤ - Ô PHẠT" : `CÂU HỎI NHẬN ${segmentText}`;
            if (isAIQuestion) {
                // Nếu là câu hỏi AI, hiển thị chủ đề
                title = `CÂU HỎI TẠO TỪ AI (${currentQuestion.topic || 'Không rõ chủ đề'})`;
                readQuestionButton.disabled = false; // Bật nút TTS
            } else {
                 readQuestionButton.disabled = true; // Tắt nút TTS cho câu hỏi cố định
            }

            document.getElementById('modalTitle').textContent = title;
            questionText.textContent = currentQuestion.q;
            optionsContainer.innerHTML = '';
            
            // Hiển thị các lựa chọn
            currentQuestion.options.forEach(option => {
                const button = document.createElement('button');
                button.textContent = option;
                button.className = "w-full p-3 mb-2 text-left bg-indigo-100 hover:bg-indigo-200 text-indigo-800 rounded-lg transition duration-150 ease-in-out font-medium";
                button.onclick = () => checkAnswer(option, isPenalty);
                optionsContainer.appendChild(button);
            });
            
            // Kích hoạt Timer
            startQuestionTimer(TIME_LIMIT);
        }

        // --- 9. Kiểm Tra Câu Trả Lời và Tính Điểm ---

        function checkAnswer(selectedOption, isPenalty) {
            // Dừng timer và ẩn modal
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            timerDisplay.classList.remove('text-red-500');
            questionModal.classList.add('hidden');
            
            readQuestionButton.disabled = true; // Vô hiệu hóa TTS sau khi trả lời
            
            const currentTeam = teams[currentPlayerIndex];
            const isCorrect = selectedOption && selectedOption === currentQuestion.answer;
            let awardedPoints = 0;
            
            const playerIndexAfterAnswer = currentPlayerIndex; 

            if (isPenalty) {
                // Xử lý Ô PHẠT
                if (isCorrect) {
                    AudioController.playCorrect(); 
                    applyDynamicEffect('correct'); // Flash xanh lá
                    showFeedback(`Đội ${currentTeam.name}: Đáp án chính xác! Bạn được **miễn trừ** hình phạt.`);
                } else {
                    AudioController.playIncorrect(); 
                    applyDynamicEffect('incorrect'); // Flash đỏ
                    currentTeam.score = Math.max(0, currentTeam.score - 10); // Trừ 10 điểm (không xuống dưới 0)
                    showFeedback(`Đội ${currentTeam.name}: Sai hoặc Hết giờ! Bị **trừ 10 điểm**. Điểm hiện tại: ${currentTeam.score}.`);
                }
            } else {
                // Xử lý các ô điểm thông thường và X2
                if (currentSpinResult.type === "x2") {
                    awardedPoints = 40; 
                } else if (currentSpinResult.type === "score") {
                    awardedPoints = currentSpinResult.value;
                } else if (currentSpinResult.type === "transfer") {
                    awardedPoints = 20; 
                }

                if (isCorrect) {
                    AudioController.playCorrect(); 
                    applyDynamicEffect('correct'); // Flash xanh lá
                    currentTeam.score += awardedPoints;
                    showFeedback(`Đội ${currentTeam.name}: **CHÍNH XÁC!** Bạn nhận được **${awardedPoints} điểm**. Điểm hiện tại: ${currentTeam.score}.`);
                } else {
                    AudioController.playIncorrect(); 
                    applyDynamicEffect('incorrect'); // Flash đỏ
                    showFeedback(`Đội ${currentTeam.name}: Sai hoặc Hết giờ. Đáp án đúng là: **${currentQuestion.answer}**. Mất lượt.`);
                }
            }
            
            updateLeaderboard();
            
            // Xử lý chuyển lượt
            if (currentSpinResult.type === "transfer") {
                currentPlayerIndex = (playerIndexAfterAnswer + 1) % teams.length;
            } else {
                moveToNextPlayer();
            }
        }

        // --- 10. Quản lý Lượt Chơi và Bảng Xếp Hạng (Leaderboard) ---

        function moveToNextPlayer() {
            currentPlayerIndex = (currentPlayerIndex + 1) % teams.length;
            updateTurnDisplay();
        }

        function updateTurnDisplay() {
            const currentTeam = teams[currentPlayerIndex];
            teamTurnDisplay.innerHTML = `<span class="px-3 py-1 rounded-full text-white font-bold" style="background-color: ${currentTeam.color};">Lượt: ${currentTeam.name}</span>`;
            currentSegmentDisplay.textContent = `Kết quả: Chờ Quay...`;
        }

        function updateLeaderboard() {
            // Sắp xếp lại đội theo điểm số (cao nhất lên đầu)
            const sortedTeams = [...teams].sort((a, b) => b.score - a.score);
            
            leaderboardContainer.innerHTML = `
                <h3 class="text-xl font-bold text-gray-700 mb-4 border-b-2 pb-2">Bảng Xếp Hạng (Top 3)</h3>
            `;
            
            sortedTeams.slice(0, 3).forEach((team, index) => {
                let medal = '';
                if (index === 0) medal = '🏆';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';

                leaderboardContainer.innerHTML += `
                    <div class="flex justify-between items-center p-3 mb-2 rounded-lg ${index === 0 ? 'bg-yellow-100 border-yellow-400 border-2 shadow-lg' : 'bg-white shadow-md'}">
                        <span class="text-lg font-bold flex items-center" style="color: ${team.color};">${medal} ${team.name}</span>
                        <span class="text-2xl font-extrabold text-gray-800">${team.score}</span>
                    </div>
                `;
            });
        }

        // Hiển thị thông báo phản hồi (thay thế cho alert)
        function showFeedback(message) {
            feedbackMessage.innerHTML = message;
            feedbackMessage.classList.remove('hidden', 'opacity-0');
            feedbackMessage.classList.add('opacity-100');
            if (feedbackMessage.dataset.timeout) {
                clearTimeout(parseInt(feedbackMessage.dataset.timeout));
            }
            const timeoutId = setTimeout(() => {
                feedbackMessage.classList.remove('opacity-100');
                feedbackMessage.classList.add('opacity-0');
                setTimeout(() => { feedbackMessage.classList.add('hidden'); }, 300); 
            }, 5000);
            feedbackMessage.dataset.timeout = timeoutId;
        }

    </script>
</head>
<body class="p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-extrabold text-center text-indigo-700 mb-8 tracking-tight">
            Vòng Quay May Mắn Âm Nhạc Lớp 6 (AI Nâng Cấp)
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Cột 1: Vòng Quay -->
            <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <div id="teamTurn" class="text-lg font-bold"></div>
                    <div id="currentSegment" class="text-lg font-bold text-gray-600">Kết quả: Chờ Quay...</div>
                </div>

                <div class="wheel-container">
                    <div id="wheel" class="bg-gray-200">
                        <!-- Segments sẽ được vẽ bằng JS -->
                    </div>
                    <div class="pointer"></div>
                </div>

                <button id="spinButton" class="w-full mt-8 py-3 bg-indigo-600 text-white text-xl font-bold rounded-xl hover:bg-indigo-700 transition duration-300 shadow-lg">
                    <span class="tracking-wider">QUAY NGAY</span>
                </button>
            </div>
            
            <!-- Cột 2: Bảng Xếp Hạng và Thông Báo -->
            <div class="md:col-span-1 flex flex-col space-y-6">
                <div id="leaderboard" class="bg-gray-50 p-6 rounded-xl shadow-xl border border-gray-200">
                    <!-- Leaderboard sẽ được cập nhật bằng JS -->
                </div>

                <!-- Hộp thông báo phản hồi -->
                <div id="feedbackMessage" class="hidden p-4 rounded-xl bg-green-100 text-green-800 font-semibold shadow-md transition duration-300 opacity-0">
                    <!-- Thông báo phản hồi sẽ xuất hiện ở đây -->
                </div>
            </div>
        </div>

        <!-- Modal Hiển thị Câu Hỏi -->
        <div id="questionModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
            <div class="question-box bg-white rounded-xl p-8 max-w-lg w-full relative shadow-2xl">
                <h2 id="modalTitle" class="text-2xl font-bold text-center mb-4 text-indigo-600">CÂU HỎI TRẮC NGHIỆM</h2>
                <div class="border-t pt-4 mb-4">
                    <p id="questionText" class="text-xl font-medium text-gray-800 mb-4">Đang tải câu hỏi...</p>
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex space-x-2">
                            <button id="generateQuestionButton" class="flex items-center justify-center px-3 py-2 bg-pink-500 text-white font-bold text-sm rounded-lg hover:bg-pink-600 transition duration-150 shadow-md whitespace-nowrap">
                                Tạo Câu Hỏi Mới ✨
                            </button>
                            <!-- Nút Nghe Câu Hỏi (TTS) -->
                            <button id="readQuestionButton" disabled class="flex items-center justify-center px-3 py-2 bg-yellow-500 text-white font-bold text-sm rounded-lg hover:bg-yellow-600 transition duration-150 shadow-md">
                                🔊 TTS
                            </button>
                        </div>
                        <div id="timerDisplay" class="text-xl font-extrabold">Thời gian: 30s</div>
                    </div>
                </div>
                
                <div id="optionsContainer" class="mt-4">
                    <!-- Các nút đáp án sẽ được chèn vào đây -->
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
